name: secret-scan

# Defense-in-depth secret/PII scanning (see .github/workflows/README.md section 5).
#   1. Credentials: gitleaks default ruleset over the FULL git history (.gitleaks.toml).
#   2. PII: real email addresses in the CURRENT tree only (.gitleaks-pii.toml) - history that
#      predates this rule is intentionally not re-scanned for PII.
# Runs on every push/PR (no path filters - a secret can land in any file) plus a weekly schedule
# so newly added upstream gitleaks rules are applied to existing history too.
#
# The gitleaks binary is pinned to an exact version and verified against the release's published
# SHA-256 checksums before execution (no third-party action with broad token access involved).

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so commits never pushed to main are scanned too
          persist-credentials: false

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfL -o "${tarball}" "${base}/${tarball}"
          curl -sSfL -o "${checksums}" "${base}/${checksums}"
          grep " ${tarball}\$" "${checksums}" | sha256sum --check --strict -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${tarball}" "${checksums}" gitleaks
          gitleaks version

      - name: Credentials - full git history
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --verbose \
            --exit-code 1

      - name: PII (email addresses) - current tree only
        run: |
          gitleaks dir . \
            --config .gitleaks-pii.toml \
            --redact \
            --verbose \
            --exit-code 1

